name: CI

# One workflow, because `needs` cannot reach across workflow files. The image
# job used to live in its own, so a push to master pushed :prod whatever the
# tests said. The same gap released three red commits from the moses repository
# before anyone noticed.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned: import-lib needs a confluent-kafka wheel, which the newest Python does not have yet.
          python-version: '3.12'
      - name: Install test requirements
        run: pip install -r pip-requirements-test.txt
      - name: Run tests
        run: python -m unittest discover -s tests

  image:
    name: PROD Docker Image
    # the gate this workflow exists for: no image leaves without the tests
    # behind it
    needs: [test]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/386,linux/amd64
          push: true
          tags: ghcr.io/senergy-platform/import-dwd-solar:prod
