name: 'Tests'

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Pinned: import-lib needs a confluent-kafka wheel, which the newest Python does not have yet.
          python-version: '3.12'
      - name: Install test requirements
        run: pip install -r pip-requirements-test.txt
      - name: Run tests
        run: python -m unittest discover -s tests
