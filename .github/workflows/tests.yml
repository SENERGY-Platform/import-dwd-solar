name: 'Tests'

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install test requirements
        run: pip install -r pip-requirements-test.txt
      - name: Run tests
        run: python -m unittest discover -s tests
